<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>جائزتك</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 0; padding: 20px; background:#f4f4f4; color:#222; }
  .wrap { max-width: 480px; margin: 0 auto; }
  h1 { font-size: 20px; text-align:center; }
  .msg { padding: 16px; border-radius: 10px; text-align:center; font-size:15px; margin-top:16px; }
  .msg.err { background:#fde2e2; color:#a10000; }
  .msg.ok { background:#e2fde6; color:#036b1f; }
  #loading { text-align:center; padding: 40px 0; color:#888; }

  #meals { display:grid; grid-template-columns: 1fr 1fr; gap:12px; margin-top:16px; }
  .meal { background:#fff; border:2px solid #eee; border-radius:12px; overflow:hidden; cursor:pointer; text-align:center; }
  .meal img { width:100%; height:110px; object-fit:cover; display:block; }
  .meal span { display:block; padding:8px; font-size:14px; }
  .meal:active { border-color:#2e7dff; }

  #resultCard { display:none; text-align:center; margin-top:16px; }
  .rewardWrap { position:relative; width:100%; max-width:400px; aspect-ratio:2/1; margin:0 auto; border-radius:12px; overflow:hidden; background:#ddd; }
  .rewardWrap img.base { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; filter: grayscale(100%); }
  .cell { position:absolute; background-repeat:no-repeat; }
  #progressText { margin-top:10px; font-size:16px; font-weight:bold; }
  #celebrate { display:none; font-size:22px; font-weight:bold; color:#e0a000; margin-top:14px; }

  .footerLink { text-align:center; margin-top:24px; }
  .footerLink a { color:#2e7dff; text-decoration:none; font-size:14px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🎁 جائزتك</h1>
  <div id="loading">جاري التحقق من الكود...</div>
  <div id="content"></div>
  <div class="footerLink"><a href="#" id="myRewardsLink">شوف كل جوائزي</a></div>
</div>

<script>
const API = window.location.origin;

function getOrCreateCustomerId() {
  let id = localStorage.getItem('rewardCustomerId');
  if (!id) {
    id = 'web-' + crypto.randomUUID();
    localStorage.setItem('rewardCustomerId', id);
  }
  return id;
}
const customerId = getOrCreateCustomerId();

function renderRewardCard(container, progress) {
  const { rewardImage, unlockedSections, completed } = progress;
  const wrap = document.createElement('div');
  wrap.className = 'rewardWrap';

  const base = document.createElement('img');
  base.className = 'base';
  base.src = API + rewardImage.imageUrl;
  wrap.appendChild(base);

  const cols = rewardImage.cols, rows = rewardImage.rows;
  wrap.style.aspectRatio = `${cols} / ${rows}`;

  // Sections are positioned in percent so this works at any rendered size.
  const cellWPct = 100 / cols, cellHPct = 100 / rows;
  unlockedSections.forEach(index => {
    const row = Math.floor(index / cols), col = index % cols;
    const cell = document.createElement('div');
    cell.className = 'cell';
    cell.style.left = (col * cellWPct) + '%';
    cell.style.top = (row * cellHPct) + '%';
    cell.style.width = cellWPct + '%';
    cell.style.height = cellHPct + '%';
    cell.style.backgroundImage = `url(${API + rewardImage.imageUrl})`;
    cell.style.backgroundSize = `${cols * 100}% ${rows * 100}%`;
    cell.style.backgroundPosition = `${col * 100 / (cols - 1 || 1)}% ${row * 100 / (rows - 1 || 1)}%`;
    wrap.appendChild(cell);
  });

  container.appendChild(wrap);

  const text = document.createElement('div');
  text.id = 'progressText';
  text.textContent = `${rewardImage.name}: ${unlockedSections.length} / ${rewardImage.totalSections} أقسام مفتوحة`;
  container.appendChild(text);

  if (completed) {
    const cel = document.createElement('div');
    cel.id = 'celebrate';
    cel.style.display = 'block';
    cel.textContent = '🎉 مبروك! أكملت الجائزة وربحت!';
    container.appendChild(cel);
  }
}

async function showMealPicker(token) {
  const content = document.getElementById('content');
  const res = await fetch(`${API}/api/reward-images`);
  const { rewardImages } = await res.json();

  const title = document.createElement('p');
  title.style.textAlign = 'center';
  title.textContent = 'اختر وجبتك لفتح جزء من جائزتها:';
  content.appendChild(title);

  const grid = document.createElement('div');
  grid.id = 'meals';
  rewardImages.forEach(img => {
    const el = document.createElement('div');
    el.className = 'meal';
    el.innerHTML = `<img src="${API + img.imageUrl}" /><span>${img.name}</span>`;
    el.onclick = () => chooseMeal(token, img.id);
    grid.appendChild(el);
  });
  content.appendChild(grid);
}

async function chooseMeal(token, rewardImageId) {
  const content = document.getElementById('content');
  content.innerHTML = '<div id="loading">جاري فتح الجائزة...</div>';

  const res = await fetch(`${API}/api/scan`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ token, customerId, rewardImageId }),
  });
  const data = await res.json();

  if (!res.ok) {
    content.innerHTML = `<div class="msg err">${data.message}</div>`;
    return;
  }

  content.innerHTML = '';
  const card = document.createElement('div');
  card.id = 'resultCard';
  card.style.display = 'block';
  renderRewardCard(card, data.progress);
  content.appendChild(card);
}

async function showMyRewards() {
  const content = document.getElementById('content');
  content.innerHTML = '<div id="loading">جاري تحميل جوائزك...</div>';

  const res = await fetch(`${API}/api/progress/${customerId}`);
  const { progress } = await res.json();
  content.innerHTML = '';

  if (progress.length === 0) {
    content.innerHTML = '<div class="msg err">لسا ما عندك أي جائزة. امسح كود من وجبتك الأولى!</div>';
    return;
  }

  progress.forEach(p => {
    const card = document.createElement('div');
    card.id = 'resultCard';
    card.style.display = 'block';
    card.style.marginBottom = '24px';
    renderRewardCard(card, p);
    content.appendChild(card);
  });
}

document.getElementById('myRewardsLink').onclick = (e) => {
  e.preventDefault();
  showMyRewards();
};

async function init() {
  const params = new URLSearchParams(window.location.search);
  const token = params.get('token');
  const loading = document.getElementById('loading');

  if (!token) {
    loading.style.display = 'none';
    await showMyRewards();
    return;
  }

  const res = await fetch(`${API}/api/scan/${token}`);
  loading.style.display = 'none';

  if (!res.ok) {
    const data = await res.json();
    document.getElementById('content').innerHTML = `<div class="msg err">${data.message}</div>`;
    return;
  }

  await showMealPicker(token);
}

init();
</script>
</body>
</html>
