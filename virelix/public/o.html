<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>طلبك | Virelix</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap">
  <div class="brand"><span class="logo">◉</span> Virelix</div>
  <div class="card" id="card"><div class="eta">جاري التحميل...</div></div>
  <div class="foot">ما في داعي لتحميل تطبيق — خلّي هالصفحة مفتوحة وراح ننبّهك أول ما يجهز طلبك</div>
</div>
<script>
const token = new URLSearchParams(location.search).get('t');
const card = document.getElementById('card');
const STEPS = [['RECEIVED', 'استلمناه'], ['PREPARING', 'بالتحضير'], ['READY', 'جاهز']];
let last = null, alerted = false, audioCtx = null, flashTimer = null;
const baseTitle = document.title;

let noteIdx = 0;
function beep() { // soft bell: sine + quiet overtone, gentle attack, long smooth decay; two notes alternate (ding-dong)
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const t = audioCtx.currentTime, f = [1046.5, 783.99][noteIdx++ % 2]; // C6, G5
    [[f, 0.28], [f * 2.76, 0.05]].forEach(([freq, vol]) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = freq; o.connect(g); g.connect(audioCtx.destination);
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(vol, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.9);
      o.start(t); o.stop(t + 0.95);
    });
  } catch (_) {}
}
let ringTimer = null;
function ringOnce() {
  if (navigator.vibrate) navigator.vibrate(300);
  beep();
}
function stopRing() {
  clearInterval(ringTimer); ringTimer = null;
  clearInterval(flashTimer); document.title = baseTitle;
  if (navigator.vibrate) navigator.vibrate(0);
  const b = document.getElementById('stopBtn'); if (b) b.remove();
}
function alertReady(o) {
  if (alerted) return; alerted = true;
  ringOnce();
  ringTimer = setInterval(ringOnce, 500); // ring every half second until the customer taps the bell
  if ('Notification' in window && Notification.permission === 'granted') {
    try { new Notification('طلبك جاهز! 🔔', { body: `رقم ${o.number} — تفضّل استلم طلبك`, tag: 'virelix', requireInteraction: true }); } catch (_) {}
  }
  let on = false;
  flashTimer = setInterval(() => { document.title = (on = !on) ? '🔔 طلبك جاهز!' : baseTitle; }, 900);
}
async function enableAlerts(btn) {
  // must run from a tap so browsers (iOS/Android) allow sound + vibration later
  beep(); if (navigator.vibrate) navigator.vibrate(80);
  if ('Notification' in window && Notification.permission === 'default') await Notification.requestPermission();
  try { if ('wakeLock' in navigator) window._wl = await navigator.wakeLock.request('screen'); } catch (_) {}
  localStorage.setItem('vx-alerts-' + token, '1');
  btn.textContent = '✓ التنبيه مفعّل'; btn.disabled = true;
}
function render(o) {
  last = o;
  if (o.status === 'READY' || o.status === 'DELIVERED') {
    document.body.classList.add('ready');
    card.innerHTML = `<div class="ready-bell" id="bell" style="cursor:pointer">🔔</div><h1 style="margin:6px 0">${o.status === 'READY' ? 'طلبك جاهز!' : 'بالعافية!'}</h1>
      <div class="num" style="font-size:72px">${o.number}</div><div>${o.status === 'READY' ? 'تفضّل استلم طلبك من الكاونتر' : 'نتمنى تكون استمتعت 🙌'}</div>`;
    if (o.status === 'READY') {
      alertReady(o);
      if (ringTimer && !document.getElementById('stopBtn')) card.insertAdjacentHTML('beforeend', '<button class="full" id="stopBtn">اضغط الجرس لإيقاف الرنة 🔕</button>');
      const sb = document.getElementById('stopBtn'); if (sb) sb.onclick = stopRing;
      document.getElementById('bell').onclick = stopRing;
    } else stopRing();
    return;
  }
  const idx = STEPS.findIndex((s) => s[0] === o.status);
  const enabled = localStorage.getItem('vx-alerts-' + token);
  card.innerHTML = `<div class="num-label">رقم طلبك</div><div class="num">${o.number}</div>
    <div class="steps">${STEPS.map((s, i) => `<div class="step ${i < idx ? 'done' : ''} ${i === idx ? 'on' : ''}"><i></i>${s[1]}</div>`).join('')}</div>
    <div class="eta">${o.waiting ? `قدامك ${o.waiting} ${o.waiting === 1 ? 'طلب' : 'طلبات'}` : 'طلبك التالي!'}</div>
    <button class="full ${enabled ? '' : 'lime'}" id="alertBtn" ${enabled ? 'disabled' : ''}>${enabled ? '✓ التنبيه مفعّل' : '🔔 فعّل التنبيه'}</button>`;
  document.getElementById('alertBtn').onclick = (e) => enableAlerts(e.target);
}
function fail(msg) { card.innerHTML = `<div class="err">${msg}</div>`; }

if (!token) fail('رابط غير صالح');
else {
  const es = new EventSource(`/api/orders/${encodeURIComponent(token)}/stream`);
  es.onmessage = (e) => render(JSON.parse(e.data));
  es.onerror = async () => {
    // EventSource retries by itself; only show an error if the order is truly gone
    const r = await fetch(`/api/orders/${encodeURIComponent(token)}`).catch(() => null);
    if (r && r.status === 404) { es.close(); fail('الطلب غير موجود أو انتهت صلاحيته'); }
  };
  document.addEventListener('visibilitychange', () => { // re-acquire wake lock after tab switch
    if (!document.hidden && localStorage.getItem('vx-alerts-' + token) && 'wakeLock' in navigator && last && last.status !== 'READY')
      navigator.wakeLock.request('screen').then((w) => (window._wl = w)).catch(() => {});
  });
}
</script>
</body>
</html>
