<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>الكاشير | Virelix</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<div class="wrap" style="max-width:640px">
  <div class="brand"><span class="logo">◉</span> Virelix — الكاشير</div>
  <div id="login" class="card">
    <p>أدخل الرمز السري</p>
    <div class="row"><input id="pin" type="password" inputmode="numeric" placeholder="PIN" /><button id="go">دخول</button></div>
    <div class="err" id="loginErr"></div>
  </div>
  <div id="app" hidden>
    <div id="demoBar" hidden class="card" style="padding:14px 18px;margin-bottom:14px;text-align:start;background:#14103a;color:#fff"><b>🧪 وضع التجربة</b> — هاي نسخة خاصة فيك وبياناتها بتنحذف بعد ساعات. جرّب: «+ طلب جديد»، وافتح صفحة الزبون من نافذة الـQR، وبعدين اضغط «جاهز ✓».</div>
    <div class="row"><input id="note" placeholder="ملاحظة (اختياري) مثل: آيس لاتيه" maxlength="60" /><button class="lime" id="newOrder">+ طلب جديد</button></div>
    <div class="orders" id="orders"></div>
    <details id="leadsBox" style="margin-top:26px"><summary style="cursor:pointer;font-weight:700">رسائل التواصل من الموقع (<span id="leadN">0</span>)</summary><div class="orders" id="leads"></div></details>
  </div>
</div>
<dialog id="dlg">
  <h2 style="margin-top:0">طلب رقم <span id="dNum"></span></h2>
  <p>خلّي الزبون يمسح الكود بكاميرا جواله</p>
  <img id="dQr" alt="QR" />
  <div><a id="dOpen" class="btn full" style="display:block;background:#c6f432;color:#111;text-decoration:none" target="_blank" rel="noopener">افتح صفحة الزبون هنا ↗</a><button id="dClose" class="full">تم</button></div>
</dialog>
<script>
const isDemo = new URLSearchParams(location.search).has('demo');
let pin = isDemo ? '' : (sessionStorage.getItem('vx-pin') || '');
let demoKey = isDemo ? (sessionStorage.getItem('vx-demo') || '') : '';
const $ = (id) => document.getElementById(id);
const H = () => (demoKey ? { 'Content-Type': 'application/json', 'x-demo-key': demoKey } : { 'Content-Type': 'application/json', 'x-staff-pin': pin });
const LABEL = { RECEIVED: 'جديد', PREPARING: 'قيد التحضير', READY: 'جاهز', DELIVERED: 'تم التسليم' };

async function startDemo() {
  if (demoKey) { // reuse the visitor's sandbox if it is still alive
    const r = await fetch('/api/orders', { headers: H() });
    if (!r.ok) { demoKey = ''; sessionStorage.removeItem('vx-demo'); }
  }
  if (!demoKey) {
    const r = await fetch('/api/demo/start', { method: 'POST' });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { $('loginErr').textContent = j.error || 'تعذّر بدء التجربة'; return; }
    demoKey = j.key; sessionStorage.setItem('vx-demo', demoKey);
  }
  $('login').hidden = true; $('app').hidden = false; $('demoBar').hidden = false; $('leadsBox').remove();
  load();
  new EventSource('/api/staff/stream?demo=' + encodeURIComponent(demoKey)).onmessage = load;
}
async function login() {
  if (isDemo) return startDemo();
  const r = await fetch('/api/staff/login', { method: 'POST', headers: H(), body: JSON.stringify({ pin }) });
  if (!r.ok) { const j = await r.json().catch(() => ({})); $('loginErr').textContent = r.status === 429 ? j.error : 'الرمز غير صحيح'; sessionStorage.removeItem('vx-pin'); return; }
  sessionStorage.setItem('vx-pin', pin);
  $('login').hidden = true; $('app').hidden = false;
  load();
  const es = new EventSource('/api/staff/stream?pin=' + encodeURIComponent(pin));
  es.onmessage = load;
}
function showQr(o) {
  $('dNum').textContent = o.number;
  $('dOpen').href = o.url;
  $('dQr').src = '/api/qr?data=' + encodeURIComponent(o.url);
  $('dlg').showModal();
}
async function setStatus(token, status) {
  await fetch(`/api/orders/${token}/status`, { method: 'POST', headers: H(), body: JSON.stringify({ status }) });
}
async function loadLeads() {
  const r = await fetch('/api/leads', { headers: H() }); if (!r.ok) return;
  const L = await r.json(); $('leadN').textContent = L.length; $('leads').innerHTML = '';
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  for (const l of L) { const el = document.createElement('div'); el.className = 'o'; el.style.alignItems = 'flex-start';
    el.innerHTML = `<div class="meta" style="color:#111;font-size:14px"><b style="font-size:16px;min-width:0">${esc(l.name)}</b> · <span dir="ltr">${esc(l.contact)}</span>${l.company ? ' · ' + esc(l.company) : ''}<br><small>${esc(l.topic)} — ${new Date(l.at).toLocaleString('ar')}</small><p style="margin:6px 0 0;white-space:pre-wrap">${esc(l.message)}</p></div>`;
    $('leads').append(el); }
}
async function load() {
  loadLeads();
  const r = await fetch('/api/orders', { headers: H() });
  if (!r.ok) return;
  const list = await r.json();
  $('orders').innerHTML = '';
  for (const o of list) {
    const el = document.createElement('div');
    el.className = 'o ' + o.status;
    const next = { RECEIVED: ['PREPARING', 'ابدأ التحضير'], PREPARING: ['READY', 'جاهز ✓'], READY: ['DELIVERED', 'تم التسليم'] }[o.status];
    el.innerHTML = `<b>${o.number}</b><div class="meta">${LABEL[o.status]}${o.note ? ' · ' + o.note.replace(/</g, '&lt;') : ''}</div><div class="acts"></div>`;
    const acts = el.querySelector('.acts');
    const qr = Object.assign(document.createElement('button'), { className: 'ghost', textContent: 'QR' });
    qr.onclick = () => showQr(o); acts.append(qr);
    if (next) { const b = Object.assign(document.createElement('button'), { className: o.status === 'PREPARING' ? 'lime' : '', textContent: next[1] }); b.onclick = () => setStatus(o.token, next[0]); acts.append(b); }
    $('orders').append(el);
  }
}
$('go').onclick = () => { pin = $('pin').value; login(); };
$('pin').addEventListener('keydown', (e) => { if (e.key === 'Enter') $('go').click(); });
$('newOrder').onclick = async () => {
  const r = await fetch('/api/orders', { method: 'POST', headers: H(), body: JSON.stringify({ note: $('note').value }) });
  if (r.ok) { $('note').value = ''; showQr(await r.json()); load(); }
};
$('dClose').onclick = () => $('dlg').close();
if (isDemo || pin) login();
</script>
</body>
</html>
