services:
  - type: web
    name: virelix
    runtime: node
    rootDir: virelix
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: starter            # a persistent disk needs a paid plan; on the free plan data.json is lost on every restart
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAFF_PIN
        sync: false          # you type it in the Render dashboard (never commit it)
      - key: DATA_DIR
        value: /var/data
    disk:
      name: virelix-data
      mountPath: /var/data
      sizeGB: 1
