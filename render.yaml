services:
  - type: web
    name: virelix
    runtime: node
    rootDir: virelix
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    plan: free               # free: sleeps after ~15 min idle, and data.json resets on restart (see DEPLOY.md)
    envVars:
      - key: NODE_ENV
        value: production
      - key: STAFF_PIN
        sync: false          # you type it in the Render dashboard (never commit it)
